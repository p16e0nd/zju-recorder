<script>
(function () {
'use strict';
const { $, el, esc, toast, api, postJson, fmtDur, fmtRemain, fmtBytes, fmtCount,
        fmtClock, fmtDateTime, initTheme, toggleTheme } = window.ZJU;
const { Media, Asr } = { Media: window.ZJU.Media, Asr: window.ZJU.Asr };

initTheme();

// ============================================================
//  全局状态
// ============================================================
const store = {
  courses: [],           // 归一化后的课程
  byKey: new Map(),      // "courseId-subId" -> 课程（详情页要立刻能渲染）
  jobs: [], marks: [], stars: [], cache: [],
  chalao: null,          // 查老师评分（本机缓存，只有点「同步」时才出网）
  storage: { bytes: 0, files: 0 },
  filter: { type: '1', liveOnly: true, q: '', teacher: '', date: '', quantum: '', college: '', room: '', zone: '', page: 1 },
  PAGE: 24,
};
const keyOf = (courseId, subId) => courseId + '-' + subId;

// 无封面时的占位是**中性灰**（见 CSS 的 --ph-bg），不按课程散列颜色。
// 不对课程做散列配色：一屏 24 张会成为彩虹，配色须克制。
const initial = (s) => String(s || '?').trim().charAt(0) || '?';

// 教学楼 → 分区。
// 匹配方式是 room.includes(key) 子串匹配，所以 key 用中文校区名。
// 「义乌」已去掉：它是真实的 YiwuBuildingA/B（一带一路国际医学院在义乌），但课少没人看；
const ZONES = [
  { name: '紫金港东', key: '紫金港东' },
  { name: '紫金港西', key: '紫金港西' },
  { name: '紫金港北', key: '紫金港北' },
  { name: '玉泉', key: '玉泉' },
  { name: '西溪', key: '西溪' },
  { name: '华家池', key: '华家池' },
  { name: '之江', key: '之江' },
  { name: '舟山', key: '舟山' },
];

// ============================================================
//  导航
// ============================================================
// 只保留有信息量的入口（首页 = 点 logo，正在直播 = 首页默认视图，诊断从课程页进入）：
// 首页 = 点左上角 logo；正在直播 = 首页默认就是"只看可看"；诊断 = 从课程页的「播放诊断」进。
// ============================================================
//  图标（内联 sprite）与「键」的构造器
// ============================================================
// 功能键用符号表达，配合符号动画与二级界面，不把文字塞进方框。
// 所以能一眼认出来的动作都用图标（说明走悬停的 data-tip），只有真正需要文字提示的才留文字
// 图标本体在 body 开头的 <svg class="sprite"> 中，24×24、1.75px 描边。
const SVGNS = 'http://www.w3.org/2000/svg';
function icon(name, cls) {
  const s = document.createElementNS(SVGNS, 'svg');
  s.setAttribute('class', 'ico' + (cls ? ' ' + cls : ''));
  s.setAttribute('aria-hidden', 'true');
  s.setAttribute('focusable', 'false');
  const u = document.createElementNS(SVGNS, 'use');
  u.setAttribute('href', '#i-' + name);
  s.appendChild(u);
  return s;
}
// 图标键：只有一个图标，说明挂在 data-tip 上（悬停/聚焦时浮出来）
function iconBtn(name, label, onclick, cls) {
  const b = el('button', 'icon-btn' + (cls ? ' ' + cls : ''));
  b.setAttribute('data-tip', label);
  b.setAttribute('aria-label', label);
  b.appendChild(icon(name));
  if (onclick) b.onclick = onclick;
  return b;
}
// 图标 + 文字：只有"光看图标不敢确定"的动作才这么用
function iconKey(name, label, onclick, cls) {
  const b = el('button', 'key' + (cls ? ' ' + cls : ''));
  b.setAttribute('aria-label', label);
  b.appendChild(icon(name, 'sm'));
  b.appendChild(el('span', null, label));
  if (onclick) b.onclick = onclick;
  return b;
}
// 忙碌态：图标转起来（符号动画 —— 比把按钮文字改成"刷新中…"更省地方也更直观）
function spinBtn(b, busy) {
  if (!b) return;
  b.classList.toggle('busy', !!busy);
  b.disabled = !!busy;
}
// 小弹层（二级界面）：点一个按钮后从它下面浮出来选下一层，比如「导出」→ TXT / SRT。
// 两级交互：先点按钮，再从浮层里选具体项。
let popEl = null;
function closePop() { if (popEl) { popEl.remove(); popEl = null; } }
function showPop(anchor, items) {
  closePop();
  const m = el('div', 'menu pop');
  for (const it of items) {
    const b = el('button', 'mi');
    b.appendChild(icon(it.icon, 'sm'));
    b.appendChild(el('span', null, it.label));
    b.onclick = () => { closePop(); it.fn(); };
    m.appendChild(b);
  }
  document.body.appendChild(m);            // 先挂上去才能量宽度
  const r = anchor.getBoundingClientRect();
  m.style.top = Math.round(r.bottom + 6) + 'px';
  m.style.left = Math.round(Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8))) + 'px';
  popEl = m;
}

// ============================================================
//  导航
// ============================================================
// 只保留有信息量的入口（首页 = 点 logo，正在直播 = 首页默认视图，诊断从课程页进入）：
// 首页 = 点左上角 logo；正在直播 = 首页默认就是"只看可看"；诊断 = 从课程页的「播放诊断」进。
const NAV = [
  { id: 'cache', label: '已缓存地址', icon: 'archive', hash: '#/cache' },
  { id: 'marks', label: '预约录制', icon: 'clock', hash: '#/marks' },
  { id: 'stars', label: '星标', icon: 'star', hash: '#/stars' },
  { id: 'jobs', label: '录制任务', icon: 'record', hash: '#/jobs', badge: () => store.jobs.filter((j) => j.status === 'recording' || j.status === 'retrying').length },
];
function renderNav(active) {
  const box = $('#navMenu');
  box.textContent = '';
  for (const n of NAV) {
    const b = el('button', 'nav-icon' + (n.id === active ? ' on' : ''));
    b.setAttribute('data-tip', n.label);
    b.setAttribute('aria-label', n.label);
    b.appendChild(icon(n.icon, 'lg'));
    const badge = n.badge ? n.badge() : 0;
    if (badge) b.appendChild(el('span', 'badge', String(badge)));
    b.onclick = () => { location.hash = n.hash; };
    box.appendChild(b);
  }
}

// ============================================================
//  封面
// ============================================================
// 封面由服务端抓帧，并发数限制为 2。503 使用退避重试，404 按无可用封面处理。
const _blobUrls = [];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function revokeThumbs() { while (_blobUrls.length) { try { URL.revokeObjectURL(_blobUrls.pop()); } catch {} } }
async function loadThumb(img, courseId, subId) {
  const q = '/api/thumb?course_id=' + encodeURIComponent(courseId) + '&sub_id=' + encodeURIComponent(subId);
  for (let attempt = 0; attempt < 6; attempt++) {
    if (!img.isConnected) return;                 // 翻页/离开了就别再拉
    try {
      const r = await fetch(q);
      if (r.status === 503) { await sleep(1000 + attempt * 1500); continue; }   // 忙 → 退避
      if (!r.ok) return;                                                        // 404 → 留渐变底
      const blob = await r.blob();
      if (!img.isConnected) return;
      const bu = URL.createObjectURL(blob);
      _blobUrls.push(bu);
      img.src = bu;
      // 图到手就把那块平灰占位淡掉：它是盒子里的另一层，不淡掉会一直挡在图上面
      const ph = img.previousElementSibling;
      if (ph && ph.classList && ph.classList.contains('ph')) ph.style.opacity = '0';
      return;
    } catch { await sleep(1200); }
  }
}
// 封面抓帧：**按可视区域触发**，不设张数上限。
// 注意：不要退回"每屏固定张数"的写法 —— 那类全局计数器在翻页后不会重置，
// 会导致后续页面一张都不抓。当前策略：
//   卡片滚进视口（含 200px 预读）才排进队列 → 客户端最多 3 个并发 → 服务端自己也有
//   3 并发的闸门（忙就回 503，前端指数退避）。每张封面 = 服务端真去拉一段直播流解一帧，
//   约 0.3~0.6MB 上游流量；同一门课 30 分钟内再看是命中磁盘缓存，不再出网。
const THUMB_PARALLEL = 4;      // 客户端并发（服务端自己有 5 个闸门，别把它喂满就够）
let showThumbs = false;
try { showThumbs = localStorage.getItem('zju_thumbs') === '1'; } catch {}
const thumbQueue = [];
let thumbInFlight = 0;
function pumpThumbs() {
  while (thumbInFlight < THUMB_PARALLEL && thumbQueue.length) {
    const t = thumbQueue.shift();
    thumbInFlight++;
    loadThumb(t.img, t.course_id, t.sub_id).catch(() => {}).then(() => { thumbInFlight--; pumpThumbs(); });
  }
}
function enqueueThumb(img, c) { thumbQueue.push({ img, course_id: c.course_id, sub_id: c.sub_id }); pumpThumbs(); }
let thumbObserver = null;
if (typeof IntersectionObserver === 'function') {
  thumbObserver = new IntersectionObserver((entries) => {
    for (const en of entries) {
      if (!en.isIntersecting) continue;
      const img = en.target;
      thumbObserver.unobserve(img);        // 抓过一次就不用再看了（翻页会重建元素）
      if (img._course) enqueueThumb(img, img._course);
    }
  }, { rootMargin: '200px 0px' });        // 提前 200px 开始抓，滚到那儿就已经有了
}
function thumbImg(c) {
  const img = document.createElement('img');
  img.alt = '';
  if (!showThumbs) return img;              // 关闭时返回空 img，占位照旧显示
  img._course = c;
  if (thumbObserver) thumbObserver.observe(img);
  else enqueueThumb(img, c);                // 没有 IntersectionObserver 就全部排队（老浏览器兜底）
  return img;
}

function coverNode(c, opt) {
  opt = opt || {};
  const wrap = el('div', 'cover');
  const ph = el('div', 'ph');
  wrap.appendChild(ph);
  if (!opt.noThumb) wrap.appendChild(thumbImg(c));
  const badge = el('span', 'badge-live' + (c.live ? '' : ' badge-cache'));
  badge.textContent = c.live ? '直播中' : '可回看';
  wrap.appendChild(badge);
  const left = el('span', 'stat');
  left.textContent = c.quantum_time || c.quantum || '';
  wrap.appendChild(left);
  const right = el('span', 'stat right');
  right.textContent = c.cached && !c.live ? fmtRemain(c.expiry) : (c.student_type === '2' ? '研究生' : '本科');
  wrap.appendChild(right);
  return wrap;
}
// ---------------- 相关直播的相似度 ----------------
// 不推荐同一个教室的直播（点进去还是同一路画面）。
// 换成一版真算相似度的：标题按"字符二元组"当向量算余弦（中文没有词边界，二元组够用、
// 零依赖），再叠加"同一位老师""同一学院"这两个本地确实有、且对选课有意义的信号。
function bigramVec(text) {
  const t = String(text || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');
  const m = new Map();
  if (t.length === 1) { m.set(t, 1); return m; }
  for (let i = 0; i + 1 < t.length; i++) {
    const g = t.slice(i, i + 2);
    m.set(g, (m.get(g) || 0) + 1);
  }
  return m;
}
function cosine(a, b) {
  if (!a.size || !b.size) return 0;
  let dot = 0, na = 0, nb = 0;
  for (const v of a.values()) na += v * v;
  for (const v of b.values()) nb += v * v;
  const small = a.size <= b.size ? a : b;
  const big = small === a ? b : a;
  for (const [k, v] of small) { const w = big.get(k); if (w) dot += v * w; }
  return dot / (Math.sqrt(na) * Math.sqrt(nb));
}
// 候选池：**只放正在直播的课**。
// 相关直播只取正在直播的课，不含仅剩缓存窗口的课程。
function relatedFor(c, n) {
  const pool = new Map();
  for (const x of store.courses) if (x.live) pool.set(keyOf(x.course_id, x.sub_id), x);
  const selfKey = keyOf(c.course_id, c.sub_id);
  const ref = bigramVec(c.title);
  const scored = [];
  for (const [k, x] of pool) {
    if (k === selfKey) continue;
    if (c.room && x.room && x.room === c.room) continue;       // ← 同教室直接排除
    let s = 0;
    if (c.teacher && x.teacher && x.teacher === c.teacher) s += 3.0;   // 同一位老师：最强信号
    const sim = cosine(ref, bigramVec(x.title));
    s += 3.0 * sim;                                                    // 课程名相似（含"XX 实验"这类同系列）
    if (c.college && x.college && x.college === c.college) s += 0.3;   // 同学院：只当弱信号
    // 门槛卡住"只有同学院分数"的无关课：不然随便一门在播课都能挤进推荐
    if (s < 0.3) continue;
    scored.push([s, x]);
  }
  scored.sort((a, b) => b[0] - a[0]);
  return scored.slice(0, n).map(([, x]) => x);
}

async function loadStorage() {

async function loadJobs() {

}
// 缓存地址是**本机**数据（服务端内存 + ~/.zju_stream_cache.json），
// 所以单独加载：课程接口挂了（学校那边经常 502）也不该让「已缓存」面板变空。
async function loadCache() {
  try {
    const c = await api('/api/cache');
    store.cache = c.list || [];
  } catch {}
  return store.cache;
}
async function loadCourses(force) {
  if (store.courses.length && !force) return store.courses;
  const r = await api('/api/courses');
  const list = r.courses || [];
  // 从 /api/cache 合并缓存窗口的剩余时间。
  await loadCache();
  const exp = new Map(store.cache.map((x) => [keyOf(x.course_id, x.sub_id), x.expiry]));
  for (const x of list) {
    const k = keyOf(x.course_id, x.sub_id);
    if (exp.has(k)) { x.cached = true; x.expiry = exp.get(k); }
  }
  store.courses = list;
  store.byKey = new Map(list.map((x) => [keyOf(x.course_id, x.sub_id), x]));
  return list;
}
// 详情页可能从"已缓存/星标/预约"点进来，那些来源没有完整课程对象 → 用兜底对象渲染
function courseOf(courseId, subId) {
  const k = keyOf(courseId, subId);
  const hit = store.byKey.get(k);
  if (hit) return hit;
  const c = store.cache.find((x) => keyOf(x.course_id, x.sub_id) === k);
  if (c) return { course_id: c.course_id, sub_id: c.sub_id, title: c.title, room: c.room, teacher: '', live: false, cached: true, expiry: c.expiry };
  return { course_id: courseId, sub_id: subId, title: '课程 ' + courseId, room: '', teacher: '', live: false, cached: false };
}

function filtered() {
  const f = store.filter;
  let out = store.courses.slice();
  if (f.type !== 'all') out = out.filter((c) => c.student_type === f.type);
  // “只看直播中”同时包含仍在有效期内的缓存地址。
  if (f.liveOnly) out = out.filter((c) => c.live || c.cached);
  if (f.q) {
    const q = f.q.toLowerCase();
    out = out.filter((c) => (c.title || '').toLowerCase().includes(q) || (c.teacher || '').toLowerCase().includes(q)
      || (c.room || '').toLowerCase().includes(q));
  }
  if (f.teacher) out = out.filter((c) => c.teacher === f.teacher);
  if (f.date) out = out.filter((c) => c.date === f.date);
  if (f.quantum) out = out.filter((c) => c.quantum === f.quantum);
  if (f.college) out = out.filter((c) => c.college === f.college);
  if (f.room) out = out.filter((c) => c.room === f.room);
  if (f.zone) out = out.filter((c) => (c.room || '').includes(f.zone));
  // 正在直播的排前面（否则默认第一页全是已经下课、只剩缓存的课，看着像"都在回放"）
  out.sort((a, b) => (b.live - a.live) || String(a.quantum_id || '').localeCompare(String(b.quantum_id || ''))
    || String(a.room || '').localeCompare(String(b.room || '')));
  return out;
}
const uniqSorted = (a) => Array.from(new Set(a.filter(Boolean))).sort();

// ============================================================
//  详情页
// ============================================================
// ============================================================
//  详情页：区块表
// ============================================================
// 详情页版式由下列区块表驱动。
// zone：'head' = 顶部标题带（横跨整页，放标题/元信息），'main' = 下面两栏的左栏，'side' = 右栏。
// 标题带的作用：让右栏第一块与播放器顶部对齐（两栏同一起点）。
// 标题/元信息如果在左栏里占着位置，右栏从 0 开始就必然比视频高一截；把它们放进横跨整页的
// 标题带使主栏播放器与侧栏顶部对齐。
// 「返回」与隐藏的「属性标签」已移除，连带"返回单独一行 / 右半固定 350px"的对齐关系一起删除；
// 现在标题带就是一行 title + meta。
const BLOCK_DEFS = [
  { id: 'title', name: '标题', col: 'head' },
  { id: 'meta', name: '元信息', col: 'head' },
  { id: 'player', name: '播放器', col: 'main' },
  { id: 'pills', name: '机位切换', col: 'main' },
  { id: 'ops', name: '操作按钮', col: 'main' },
  { id: 'info', name: '课程信息', col: 'main', hidden: true },   // 与标题/元信息完全重复
  { id: 'rec', name: '实时进度（录制）', col: 'main' },
  // 右栏顺序：关注/预约 → 实时字幕 → 相关直播
  { id: 'teacher', name: '关注/预约', col: 'side' },
  { id: 'asr', name: '实时字幕', col: 'side' },
  { id: 'reco', name: '相关直播', col: 'side' },
];
// 区块字号。
const SIZE_PX = {
  title: 20, meta: 13, ops: 13.5, pills: 13, info: 14, asr: 14, reco: 14, teacher: 16,
};
let detailState = { streams: [], cur: null, course: null, video: null, nodes: {}, ctx: null };

const COL_PX = { maxWidth: 1504, mainWidth: 1123, sideWidth: 350, gap: 30 };
const itemsIn = (zone) => BLOCK_DEFS.filter((b) => b.col === zone && !b.hidden).map((b) => b.id);
// 区块的字号/间距：整页一个默认值，不再按区块可调
function applyBlockDefaults(node, id) {
  if (SIZE_PX[id]) node.style.setProperty('--blk-fs', SIZE_PX[id] + 'px');
  node.style.marginBottom = '12px';
}
// 详情页的列宽/栏距。**不再覆盖主色** —— 编辑器那会儿会把 --blue 写成定值，
// 结果在暗色主题下也强行用亮蓝（暗色该用更亮的 #3FB8E8），这个副作用跟着编辑器一起删掉了。
function applyGlobal(root, layoutEl) {
  if (root) root.style.maxWidth = COL_PX.maxWidth + 'px';
  if (layoutEl) {
    // 传变量而不是写死列宽，窄屏时由媒体查询接管（见 .detail 的注释）
    layoutEl.style.setProperty('--main-w', COL_PX.mainWidth + 'px');
    layoutEl.style.setProperty('--side-w', COL_PX.sideWidth + 'px');
    layoutEl.style.setProperty('--gap', COL_PX.gap + 'px');
  }
}

// ---- 各区块的内容（只建一次，之后靠"移动节点"重排，播放器不会被重建/中断）----
function buildBlocks(c) {
  const nodes = {};
  const ctx = { c };

  nodes.title = el('h1', 'd-title', c.title || '(无标题)');

  nodes.meta = (() => {
    const m = el('div', 'd-meta');
    const st = c.live ? ['live', '直播中'] : c.cached ? ['', '可回看（缓存窗口内）'] : ['', (c.status_label || '未开播')];
    m.appendChild(el('span', 'tag' + (st[0] ? ' live' : ''), st[1]));
    for (const t of [c.teacher, c.college, c.room, c.date, c.quantum_time || c.quantum]) if (t) m.appendChild(el('span', null, t));
    if (c.cached && c.expiry) m.appendChild(el('span', null, fmtRemain(c.expiry)));
    return m;
  })();

  const pbox = el('div', 'player-box');
  const video = document.createElement('video');
  video.controls = true; video.playsInline = true; video.autoplay = true;
  pbox.appendChild(video);
  detailState.video = video;
  ctx.pbox = pbox; ctx.video = video;
  nodes.player = pbox;

  nodes.pills = (() => {
    const u = el('div', 'under-player');
    u.appendChild(el('span', 'lab', '机位：'));
    ctx.under = u;
    return u;
  })();

  nodes.ops = (() => { const o = el('div', 'ops'); ctx.ops = o; return o; })();

  // 实时进度（录制）：点录制之后不用离开直播页就能看进度、能停。
  // 主菜单的「录制任务」页仍然保留，但不再是你查看进度的唯一入口。
  nodes.rec = (() => {
    const card = el('div', 'card card-pad rec-card');
    const h = el('div', 'rec-h');
    h.appendChild(el('h3', null, '实时进度'));
    const badge = el('span', 'rec-badge');
    h.appendChild(badge);
    card.appendChild(h);
    const box = el('div', 'rec-list');
    card.appendChild(box);
    ctx.recBox = box; ctx.recBadge = badge;
    return card;
  })();

  nodes.info = (() => {
    const card = el('div', 'card card-pad');
    const desc = el('div', 'desc');
    desc.textContent = [c.title, c.teacher ? '教师：' + c.teacher : '', c.room ? '教室：' + c.room : '',
      c.date ? '日期：' + c.date + ' ' + (c.quantum || '') : ''].filter(Boolean).join('\n');
    card.appendChild(desc);
    return card;
  })();

  // 字幕面板：**一直占位**（未开启时也占一块位置）；
  // 面板内部「正在听（最新）→ 已定稿（新的在最上面）」，往回看往下滑。
  nodes.asr = (() => {
    const asr = el('section', 'asr idle');
    const ah = el('div', 'asr-head');
    const dot = el('span', 'asr-dot');
    const stt = el('span', 'asr-state', '未开启');
    ah.appendChild(dot); ah.appendChild(stt); ah.appendChild(el('span', 'spacer'));
    // 头部使用图标键；导出格式在二级浮层中选择。
    const bExport = iconBtn('download', '导出字幕', (ev) => {
      ev.stopPropagation();
      showPop(bExport, [
        { icon: 'download', label: '导出 TXT', fn: () => Asr.exportAs('txt') },
        { icon: 'download', label: '导出 SRT', fn: () => Asr.exportAs('srt') },
      ]);
    });
    const bCopy = iconBtn('copy', '复制全文', () => Asr.copyText());
    const bStop = iconBtn('stop', '停止识别', () => Asr.stop());
    const bStart = iconKey('mic', '开始识别', () => Asr.start(detailState.cur), 'primary');
    for (const b of [bExport, bCopy, bStop, bStart]) ah.appendChild(b);
    asr.appendChild(ah);
    const ameta = el('div', 'asr-meta'); asr.appendChild(ameta);
    const alive = el('div', 'asr-live'); asr.appendChild(alive);
    const abody = el('div', 'asr-body'); asr.appendChild(abody);
    const ahint = el('div', 'asr-hint'); asr.appendChild(ahint);
    Asr.mount({ panel: asr, dot, state: stt, meta: ameta, live: alive, body: abody, hint: ahint,
                startBtn: bStart, stopBtn: bStop, expoBtns: [bExport, bCopy] });
    ctx.asrPanel = asr;
    return asr;
  })();

  // 右上不显示与标题重复的教师名牌，改为把「关注这个老师」并进来，
  // 关注类按钮不放在视频下方的操作条里。只留老师名 + 两个键，不重复学院/教室。
  nodes.teacher = (() => {
    const card = el('div', 'side-card');
    const head = el('div', 'side-head');
    head.dataset.teacher = c.teacher || '';
    head.appendChild(el('span', 'tn', c.teacher || '未知教师'));
    const badge = chalaoBadge(c.teacher);      // 查老师评分（可在头像菜单里关掉）
    if (badge) head.appendChild(badge);
    card.appendChild(head);
    const sop = el('div', 'side-ops');
    const bFollow = iconKey('star', '关注老师', async () => {
      if (!c.teacher) return toast('这门课没有教师信息');
      try {
        await postJson('/api/stars', { type: 'teacher', value: c.teacher, label: c.teacher });
        toast('已关注（星标）' + c.teacher);
        store.stars = (await api('/api/stars')).stars;
      } catch (e) { toast(e.message); }
    }, 'primary');
    const bMk = iconKey('clock', '预约这场课', () => openMarkModal(c));
    sop.appendChild(bFollow); sop.appendChild(bMk);
    card.appendChild(sop);
    return card;
  })();

  nodes.reco = (() => {
    const card = el('div', 'side-card');
    const rh = el('div', 'card-h'); rh.appendChild(el('h3', null, '相关直播')); card.appendChild(rh);
    const box = el('div'); box.style.padding = '4px 16px 12px'; card.appendChild(box);
    const related = relatedFor(c, 8);
    if (!related.length) box.appendChild(el('div', 'hint', '暂无相关直播'));
    else for (const x of related) box.appendChild(recoRow(x));
    return card;
  })();

  return { nodes, ctx };
}

function blkNode(id, zone) {
  const node = detailState.nodes[id];
  if (!node) return null;
  const wrap = el('div', 'blk blk-' + id);
  wrap.dataset.id = id;
  wrap.dataset.zone = zone;
  wrap.appendChild(node);
  applyBlockDefaults(node, id);
  return wrap;
}
function renderCols(mainEl, sideEl) {
  const band = detailState.bandEl;
  const bandL = detailState.bandLeftEl;
  for (const c of [mainEl, sideEl, bandL]) if (c) { c.textContent = ''; }
  if (band) band.style.display = '';
  const put = (container, ids, zone) => {
    for (const id of ids) {
      const w = blkNode(id, zone);
      if (w) container.appendChild(w);
    }
  };
  // 标题带：标题 + 元信息整行铺开（右半的「属性标签」已移除，
  // 连同它那套"右半固定 350px"的对齐关系一起删了 —— 所以 band-right 不再存在）
  put(bandL, itemsIn('head'), 'head');
  if (band && !bandL.children.length) band.style.display = 'none';
  put(mainEl, itemsIn('main'), 'main');
  put(sideEl, itemsIn('side'), 'side');
}

function pageDetail(courseId, subId) {
  const c = courseOf(courseId, subId);
  detailState.course = c;
  const v = host(); v.textContent = '';

  const wrap = el('div', 'wrap');
  applyGlobal(wrap, null);

  const layout = el('div', 'detail');
  const band = el('div', 'band');
  const bandL = el('div', 'band-left');
  band.appendChild(bandL);
  const main = el('div', 'col-main'); main.style.minWidth = '0';
  const side = el('div', 'col-side');
  layout.appendChild(band); layout.appendChild(main); layout.appendChild(side);
  applyGlobal(wrap, layout);
  wrap.appendChild(layout);
  v.appendChild(wrap);

  const built = buildBlocks(c);
  detailState.nodes = built.nodes;
  detailState.ctx = built.ctx;
  detailState.mainEl = main; detailState.sideEl = side;
  detailState.bandEl = band; detailState.bandLeftEl = bandL;

  renderCols(main, side);

  // 媒体钩子（提示放进播放器内部，不撑破布局）
  const pbox = built.ctx.pbox;
  Media.config({
    getIdentity: () => ({ course: c.title, room: c.room }),
    onMessage: (vid, text) => {
      let m = pbox.querySelector('.player-msg');
      if (!m) { m = el('div', 'player-msg'); pbox.appendChild(m); }
      m.textContent = text || '';
      m.style.display = text ? '' : 'none';
    },
    onStream: (s) => {
      detailState.cur = s || null;
      if (!s) return;
      Array.from(built.ctx.under.querySelectorAll('.pill')).forEach((b) => b.classList.toggle('on', b.dataset.k === s.key));
      buildOps();
    },
  });

  buildOps();
  renderRec();
  resolveAndPlay(c);
}

// 录制进度：只要能拿到 job 列表就一直能画。时长用 startedAt 现算，所以秒数是自己在走的，
// 不必等 /api/jobs 的轮询（那个 5 秒一次，只负责把"有哪些任务"刷新）。
function renderRec() {
  const ctx = detailState.ctx;
  if (!ctx || !ctx.recBox) return;
  const box = ctx.recBox, badge = ctx.recBadge;
  const jobs = (store.jobs || []).slice().sort((a, b) => {
    const rank = (j) => (j.status === 'recording' || j.status === 'retrying') ? 0 : 1;
    return rank(a) - rank(b) || (b.startedAt || 0) - (a.startedAt || 0);
  });
  const active = jobs.filter((j) => j.status === 'recording' || j.status === 'retrying');
  if (badge) {
    badge.textContent = active.length ? ('录制中 ' + active.length) : '';
    badge.className = 'rec-badge' + (active.length ? ' on' : '');
  }
  box.textContent = '';
  if (!jobs.length) {
    box.appendChild(el('div', 'hint', '当前没有录制任务'));
    return;
  }
  for (const j of jobs) {
    const row = el('div', 'rec-row');
    const g = el('div', 'grow');
    g.appendChild(el('div', 'l1', (j.course || '') + ' · ' + (j.label || '')));
    const st = { recording: ['live', '录制中'], retrying: ['warn', '重试中'], stopped: ['mute', '已停止'], error: ['err', '出错'] }[j.status] || ['mute', j.status];
    const dur = fmtDur(Math.floor(((j.endedAt || Date.now()) - (j.startedAt || Date.now())) / 1000));
    const extra = j.error ? ' · ' + j.error : (j.attempts > 1 ? ' · 第 ' + j.attempts + ' 次开流' : '');
    g.appendChild(el('div', 'l2', '已录 ' + dur + extra));
    row.appendChild(g);
    row.appendChild(el('span', 'st ' + st[0], st[1]));
    if (j.status === 'recording' || j.status === 'retrying') {
      const b = el('button', 'key', '停止');
      b.onclick = async () => {
        try { await postJson('/api/stop', { id: j.id }); toast('已请求停止（等 ffmpeg 写完收尾）'); await loadJobs(); renderRec(); }
        catch (e) { toast(e.message); }
      };
      row.appendChild(b);
    }
    box.appendChild(row);
  }
}

function buildOps() {
  const ctx = detailState.ctx;
  if (!ctx || !ctx.ops) return;
  const c = detailState.course, s = detailState.cur;
  const ops = ctx.ops;
  ops.textContent = '';
  // 操作条：等宽的"大键"，**只放图标**，说明走悬停提示
  const mk = (name, label, fn) => {
    const b = el('button', 'key wide');
    b.setAttribute('data-tip', label);
    b.setAttribute('aria-label', label);
    b.appendChild(icon(name, 'lg'));
    b.onclick = fn;
    ops.appendChild(b);
    return b;
  };
  mk('record', '录制主画面（只录教师机位）', async () => {
    // **必须取主画面机位**，不取"当前正在看的机位"：服务端只允许录制主画面，
    // 否则返回 400「当前只支持录制主画面」。
    const t = (detailState.streams || []).find((x) => x.key === 'teacher');
    if (!t) return toast('这门课没有主画面机位，无法录制');
    try {
      await postJson('/api/record', { url: t.recordUrl || t.url, recordUrl: t.recordUrl || t.url,
        label: t.label, key: 'teacher', course: c.title });
      toast('开始录制主画面');
      await loadJobs(); renderRec(); renderNav(currentNavId());
    } catch (e) { toast('录制失败：' + e.message); }
  });
  mk('pulse', '播放诊断', () => { detailState.course = c; location.hash = '#/diag'; });
  mk('link', '复制这门课的链接', () => {
    const url = location.origin + '/#/c/' + c.course_id + '/' + c.sub_id;
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('已复制'), () => toast(url));
    else toast(url);
  });
  // 「当前机位」提示挪到机位那一行：操作条要保持等宽"键"形，塞 spacer 会把布局挤歪
  const underEl = detailState.ctx && detailState.ctx.under;
  if (underEl) {
    const old = underEl.querySelector('.cur-pill-hint');
    if (old) old.remove();
    if (s) underEl.appendChild(el('span', 'hint cur-pill-hint', '当前：' + (s.label || s.key)));
  }
}

async function resolveAndPlay(c) {
  const ctx = detailState.ctx;
  const underEl = ctx.under, video = ctx.video;
  underEl.textContent = '';
  underEl.appendChild(el('span', 'lab', '机位：'));
  underEl.appendChild(el('span', 'hint', '解析地址中…'));
  let r;
  try {
    r = await api('/api/streams?course_id=' + encodeURIComponent(c.course_id) + '&sub_id=' + encodeURIComponent(c.sub_id)
      + '&title=' + encodeURIComponent(c.title || '') + '&room=' + encodeURIComponent(c.room || ''));
  } catch (e) {
    underEl.textContent = ''; underEl.appendChild(el('span', 'lab', '机位：'));
    underEl.appendChild(el('span', 'hint', '解析失败：' + e.message));
    return;
  }
  detailState.streams = r.streams || [];
  underEl.textContent = ''; underEl.appendChild(el('span', 'lab', '机位：'));
  if (!detailState.streams.length) {
    underEl.appendChild(el('span', 'hint', (r.dropped && r.dropped.length)
      ? '该课只提供 ' + Array.from(new Set(r.dropped.map((d) => d.type))).join('/') + ' 地址，浏览器无法直接播放'
      : (c.live ? '未解析到直播流' : '这节课不在直播、缓存也过期了')));
    return;
  }
  for (const s of detailState.streams) {
    const b = el('button', 'chip' + (s.key === 'teacher' ? ' on' : ''), Media.streamName(s));
    b.dataset.k = s.key;
    b.onclick = () => { detailState.cur = s; Media.playStream(video, s); };
    underEl.appendChild(b);
  }
  if (r.source === 'cached') underEl.appendChild(el('span', 'hint', '缓存地址 · ' + fmtRemain(r.expiry)));
  const first = detailState.streams.find((s) => s.key === 'teacher') || detailState.streams[0];
  detailState.cur = first;
  Media.playStream(video, first);
}

// ============================================================
//  预约弹窗（挑未来场次）
// ============================================================
async function openMarkModal(c) {
  const body = $('#modalBody'); body.textContent = '';
  const mh = el('div', 'mh');
  mh.appendChild(el('h3', null, '预约录制'));
  const x = iconBtn('x', '关闭', closeModal); mh.appendChild(x);
  body.appendChild(mh);
  body.appendChild(el('div', 'msub', c.title + (c.room ? ' · ' + c.room : '')));
  const box = el('div', 'sess-list'); box.appendChild(el('div', 'empty', '正在拉取该课的场次…'));
  body.appendChild(box);
  const ma = el('div', 'ma');
  const save = el('button', 'key primary', '保存预约');
  save.disabled = true; save.onclick = async () => {
    const picked = Array.from(box.querySelectorAll('input:checked')).map((i) => JSON.parse(i.value));

}
function chalaoEntry(name) {

function route() {
  revokeThumbs();                 // 换页就把上一屏的封面 blob 回收掉
  try { routeInner(); } catch (e) {
    // 一次异常就会让整页变空，看起来像"卡死"。这里兜住：把错误显式显示出来，
    // 页面结构仍然可用（可以切页/刷新），错误也不会被吞掉。
    console.error('[zju-ui] 渲染失败', e);
    const v = host();
    if (v) {
      v.textContent = '';
      const w = el('div', 'wrap');
      const c = el('div', 'empty');
      c.textContent = '这个页面渲染出错了：' + (e && e.message ? e.message : String(e))
        + '　—— 点这里刷新重试';
      c.style.cursor = 'pointer';
      c.onclick = () => location.reload();
      w.appendChild(c); v.appendChild(w);
    }
  }
}

}
// 主动关闭：把地址栏收回到底页，但**用 replaceState 静默改**，
// 这样不会触发 hashchange → 不会重新渲染底页 → 视频继续播。
function closeDrawer() {
  const wasOpen = $('#drawer').classList.contains('on');
  hideDrawer();
  if (wasOpen) {
    try { history.replaceState(null, '', renderedBase || '#/'); } catch {}
    renderNav(currentNavId());
  }
}

function routeInner() {
  const hash = location.hash || '#/';
  const page = hash.replace(/^#\//, '').split('?')[0] || 'home';

  if (PANELS[page]) {
    // 抽屉路由：底下的页面原样保留（没有就垫一个首页），只把抽屉滑出来
    if (!renderedBase) { renderedBase = '#/'; renderNav('home'); pageHome(); }
    openDrawer(page);
    return;
  }

  hideDrawer();
  const m = hash.match(/^#\/c\/([^/]+)\/([^/]+)/);
  if (m) {
    renderedBase = hash.split('?')[0];
    renderNav('home');
    pageDetail(decodeURIComponent(m[1]), decodeURIComponent(m[2]));
    scrollTo(0, 0);
    return;
  }
  renderedBase = page === 'live' ? '#/live' : '#/';
  if (page === 'live') { store.filter.liveOnly = true; store.filter.page = 1; renderNav('live'); }
  else renderNav('home');
  pageHome();
}
window.addEventListener('hashchange', route);

// ============================================================
//  顶栏交互
// ============================================================
$('#navSearch').addEventListener('input', (e) => {
  store.filter.q = e.target.value.trim();
  store.filter.page = 1;
  if (!location.hash || location.hash === '#/' || location.hash === '#/live') { if (location.hash !== '#/live') location.hash = '#/live'; else route(); }
  else route();
});
$('#drawerClose').onclick = closeDrawer;
$('#drawerBackdrop').onclick = closeDrawer;
addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (popEl) { closePop(); return; }
  if (!$('#avatarMenu').hidden) { hideAvatarMenu(); return; }
  if ($('#drawer').classList.contains('on')) closeDrawer();
});
$('#themeToggle').onclick = () => { toggleTheme(); paintTopbar(); };
// 封面开关：默认关。开了会每屏抓最多 12 张，每张都要从 CDN 拉一段流，30 分钟内不重复。
$('#thumbBtn').onclick = () => setThumbs(!showThumbs);
function setThumbs(v) {
  showThumbs = !!v;
  try { localStorage.setItem('zju_thumbs', showThumbs ? '1' : '0'); } catch {}
  toast(showThumbs ? '封面抓帧：开（滚到哪儿抓到哪儿，每张约 0.3~0.6MB 上游流量）' : '封面抓帧：关，不再拉直播流');
  paintTopbar();
  // 详情页没有封面，不用重画 —— 重画会把正在播的视频打断
  if (!/^#\/c\//.test(location.hash || '')) route();
}
$('#avatarBtn').onclick = (e) => { e.stopPropagation(); toggleAvatarMenu(); };
addEventListener('click', (e) => {
  if (popEl && e.target.closest && !e.target.closest('.pop')) closePop();
  if (e.target.closest && (e.target.closest('#avatarMenu') || e.target.closest('#avatarBtn'))) return;
  hideAvatarMenu();
});
$('#modal').onclick = (e) => { if (e.target === $('#modal')) closeModal(); };
Asr.bind();

// ---- 顶栏右侧：图标 + 悬停说明 ----
function paintTopbar() {
  const dark = document.documentElement.dataset.theme === 'dark';
  const tb = $('#themeToggle');
  tb.textContent = ''; tb.appendChild(icon(dark ? 'sun' : 'moon'));
  tb.setAttribute('data-tip', dark ? '现在是暗色，点一下切亮色' : '现在是亮色，点一下切暗色');
  tb.setAttribute('aria-label', '切换明暗');
  const th = $('#thumbBtn');
  th.textContent = ''; th.appendChild(icon('image'));
  th.classList.toggle('on', showThumbs);
  th.setAttribute('data-tip', showThumbs ? '封面抓帧：开（每屏最多抓 12 张）' : '封面抓帧：关（开了会拉直播流，耗流量）');
  th.setAttribute('aria-label', '封面抓帧');
  paintAvatar();
}

// ---- 头像：本地选图（不写盘、不上传）+ 令牌状态点 + 二级菜单 ----
const AVATAR_KEY = 'zju_avatar';
function avatarSrc() { try { return localStorage.getItem(AVATAR_KEY) || ''; } catch { return ''; } }
function paintAvatar() {
  const src = avatarSrc();
  const img = $('#avatarImg'), fb = $('#avatarFallback');
  if (src) { img.src = src; img.hidden = false; fb.hidden = true; }
  else { img.removeAttribute('src'); img.hidden = true; fb.hidden = false; }
}
// 选一张本机图片当头像：读进来 → canvas 缩到 128×128 → 存 localStorage。
// 只是本机选图，不上传：图像数据不出本机。
function pickAvatar() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onerror = () => toast('这张图读不出来');
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => toast('这个格式浏览器解不开，换张 png/jpg');
      im.onload = () => {
        const S = 128, cv = document.createElement('canvas');
        cv.width = S; cv.height = S;
        const g = cv.getContext('2d');
        const k = Math.min(im.width, im.height);          // 居中裁成正方形
        g.drawImage(im, (im.width - k) / 2, (im.height - k) / 2, k, k, 0, 0, S, S);
        const out = cv.toDataURL('image/jpeg', 0.85);
        try { localStorage.setItem(AVATAR_KEY, out); }
        catch { toast('这张图存不下，换张小一点的'); return; }
        paintAvatar();
        toast('头像已换（只存在这台机器的浏览器里）');
      };
      im.src = String(fr.result);
    };
    fr.readAsDataURL(f);
  };
  inp.click();
}
function hideAvatarMenu() { $('#avatarMenu').hidden = true; }
function toggleAvatarMenu() {
  const m = $('#avatarMenu');
  if (m.hidden) { buildAvatarMenu(); m.hidden = false; } else hideAvatarMenu();
}
function buildAvatarMenu() {
  const m = $('#avatarMenu');
  m.textContent = '';
  const h = el('div', 'mh');
  h.textContent = loginState.ok
    ? ('令牌有效' + (loginState.exp ? '，至 ' + new Date(loginState.exp * 1000).toLocaleString('zh-CN') : '')
       + (loginState.auto ? '　·　已配置自动登录' : ''))
    : '令牌无效或缺失 —— 进「设置」重新登录';
  m.appendChild(h);
  const mi = (iconName, label, right, fn, on) => {
    const b = el('button', 'mi' + (on ? ' on' : ''));
    b.appendChild(icon(iconName, 'sm'));
    b.appendChild(el('span', null, label));
    if (right) b.appendChild(el('span', 'k', right));
    b.onclick = fn;
    m.appendChild(b);
    return b;
  };
  mi('settings', '设置（令牌 / 登录 / 存储 / 版本）', '', () => { hideAvatarMenu(); location.hash = '#/settings'; });
  m.appendChild(el('div', 'msep'));
  const cs = store.chalao && store.chalao.stats;
  mi(chalaoShow() ? 'eye' : 'eye-off', '显示查老师评分', chalaoShow() ? '开' : '关',
    () => { setChalaoShow(!chalaoShow()); applyChalaoVisibility(); buildAvatarMenu(); }, chalaoShow());
  mi('cloud-down', '同步查老师评分', cs ? (cs.pendingWatch ? cs.pendingWatch + ' 位待同步' : '已是最新') : '',
    () => { hideAvatarMenu(); openChalao(''); });
  m.appendChild(el('div', 'msep'));
  mi('image', '封面抓帧', showThumbs ? '开' : '关', () => { setThumbs(!showThumbs); buildAvatarMenu(); }, showThumbs);
  const dark = document.documentElement.dataset.theme === 'dark';
  mi(dark ? 'sun' : 'moon', dark ? '切到亮色' : '切到暗色', '', () => { toggleTheme(); paintTopbar(); buildAvatarMenu(); });
  m.appendChild(el('div', 'msep'));
  mi('user', '选一张本地图片当头像…', '', () => { pickAvatar(); });
  if (avatarSrc()) mi('x', '用回默认头像', '', () => { try { localStorage.removeItem(AVATAR_KEY); } catch {} paintAvatar(); buildAvatarMenu(); toast('已用回默认'); });
}

let loginState = { ok: false, exp: 0, auto: false };
async function refreshLoginBtn() {
  try {
    const s = await api('/api/status');
    const ok = !!(s.jwt && s.jwt.present && !s.jwt.expired);
    loginState = { ok, exp: (s.jwt && s.jwt.exp) || 0, auto: !!s.autoLogin };
    $('#avatarDot').classList.toggle('bad', !ok);
    const tip = ok
      ? ('令牌有效' + (loginState.exp ? '，至 ' + new Date(loginState.exp * 1000).toLocaleString('zh-CN') : '')
         + (loginState.auto ? '　·　自动登录已配置' : '') + '　—　点这里：设置 / 查老师 / 主题')
      : '令牌无效或缺失 —— 点这里去设置里重新登录';
    const b = $('#avatarBtn');
    b.setAttribute('data-tip', tip);
    b.setAttribute('aria-label', '账号与设置');
    const fb = $('#avatarFallback');
    fb.textContent = ok ? (loginState.auto ? '自' : '令') : '!';
    paintAvatar();
  } catch {}
}

// ============================================================
//  启动
// ============================================================
(async function boot() {
  await loadStorage();
  await loadJobs();
  await refreshLoginBtn();
  try { store.marks = (await api('/api/marks')).marks; } catch {}
  try { store.stars = (await api('/api/stars')).stars; } catch {}
  await loadCache();          // 本机数据，先拿到手；课程接口挂了「已缓存」也照常能用
  await loadChalao();         // 查老师评分也是本机缓存（没同步过就是空的，不影响别的）
  try { await loadCourses(false); }
  catch (e) {
    // 课程拉不到（令牌过期 / 上游挂）时**仍然要走 route()**：
    // 否则直链打开 #/marks、#/settings 这类抽屉会什么都不显示（右侧面板并不依赖课程列表）。
    const w = el('div', 'wrap');
    w.appendChild(el('div', 'empty', '课程加载失败：' + e.message + '　（令牌可能过期，可点右上角头像进「设置」重新登录）'));
    const v0 = $('#view'); v0.textContent = ''; v0.appendChild(w);
    renderNav('home');
  }
  paintTopbar();
  route();
  setInterval(() => { loadJobs().then(() => {
    // 抽屉开着「录制任务」就就地重画抽屉；否则只更新进度卡（不重排整页，避免打断播放）
    if ($('#drawer').classList.contains('on') && $('#drawerTitle').textContent === '录制任务') openDrawer('jobs');
    else { renderNav(currentNavId()); renderRec(); }
  }); }, 5000);
  // 「已录 mm:ss」的秒数必须自己走：/api/jobs 是 5 秒一次，只负责刷新"有哪些任务"
  setInterval(() => { if (document.querySelector('.rec-card')) renderRec(); }, 1000);
  setInterval(loadStorage, 30000);
})();
function currentNavId() {
  const p = (location.hash || '#/').replace(/^#\//, '').split('?')[0] || 'home';
  return p === '' ? 'home' : p;
}
})();
